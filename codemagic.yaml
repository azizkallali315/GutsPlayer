workflows:
  android-workflow:
    name: GutsPlayer
    max_build_duration: 30
    environment:
      java: 17

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Install Gradle
        script: |
          curl -L https://services.gradle.org/distributions/gradle-8.0-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /home/builder/gradle
          export PATH=$PATH:/home/builder/gradle/gradle-8.0/bin
          gradle --version

      - name: Build debug APK
        script: |
          export PATH=$PATH:/home/builder/gradle/gradle-8.0/bin
          gradle assembleDebug --stacktrace --project-dir .

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - med.aziz.gallali@gmail.com        # ← change this to your email
        notify:
          success: true
          failure: true
